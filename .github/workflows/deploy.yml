name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set — skipping Render deployment"
            exit 0
          fi
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

  smoke-test:
    needs: [deploy-backend]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Smoke Test Wait
        run: sleep 60
      - name: Smoke Test Backend
        run: |
          BACKEND_URL="${{ secrets.BACKEND_URL }}"
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL not set — skipping smoke test"
            exit 0
          fi
          echo "Backend health check: $BACKEND_URL/api/v1/health"
          curl -f "$BACKEND_URL/api/v1/health" || echo "Backend not yet reachable"
      - name: Smoke Test Frontend
        run: |
          FRONTEND_URL="${{ secrets.FRONTEND_URL }}"
          if [ -z "$FRONTEND_URL" ]; then
            echo "FRONTEND_URL not set — skipping smoke test"
            exit 0
          fi
          echo "Frontend check: $FRONTEND_URL"
          curl -f "$FRONTEND_URL" || echo "Frontend not yet reachable"
