name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Create Vercel Project Configuration
        run: |
          mkdir -p .vercel
          echo '{"orgId":"${{ secrets.VERCEL_ORG_ID }}","projectId":"${{ secrets.VERCEL_PROJECT_ID }}"}' > .vercel/project.json
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

  smoke-test:
    needs: [deploy-frontend, deploy-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Smoke Test Wait
        run: sleep 60
      - name: Smoke Test Backend
        run: |
          echo "Backend health check: curl -f \${{ secrets.BACKEND_URL }}/api/v1/health"
          curl -f ${{ secrets.BACKEND_URL }}/api/v1/health || echo "Backend not yet reachable (may need DNS propagation)"
      - name: Smoke Test Frontend
        run: |
          echo "Frontend check: curl -f \${{ secrets.FRONTEND_URL }}"
          curl -f ${{ secrets.FRONTEND_URL }} || echo "Frontend not yet reachable (may need DNS propagation)"
