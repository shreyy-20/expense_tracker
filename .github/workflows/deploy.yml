name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./frontend

  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

  smoke-test:
    needs: [deploy-frontend, deploy-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Smoke Test Wait
        run: sleep 60
      - name: Smoke Test Backend
        run: |
          echo "Backend health check: curl -f \${{ secrets.BACKEND_URL }}/api/v1/health"
          curl -f ${{ secrets.BACKEND_URL }}/api/v1/health || echo "Backend not yet reachable (may need DNS propagation)"
      - name: Smoke Test Frontend
        run: |
          echo "Frontend check: curl -f \${{ secrets.FRONTEND_URL }}"
          curl -f ${{ secrets.FRONTEND_URL }} || echo "Frontend not yet reachable (may need DNS propagation)"
